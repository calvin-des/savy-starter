<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>

        <link href="style.css" rel="stylesheet"/>

    <body id="questions-page" class="journey-page photo-page">
        <main class="page-scene">
            <!-- Base photograph changes with the current question. -->
            <img class="page-background" id="question-header" src="assets/images/question-headers-imgs/q1-income-loss-runway.webp" width="1920" height="1149" alt="" aria-hidden="true" decoding="async" fetchpriority="high">
            <div class="brand-logo">
                <img src="assets/om-logo.png" alt="Old Mutual" width="80" height="120">
            </div>
            <!-- Heading, panel and supporting message move together. -->
            <section class="page-unit" aria-labelledby="page-title">
                <header class="page-heading">
                    <h1 class="page-title" id="page-title">Build your future</h1>
                    <p class="page-subtitle">Profile</p>
                </header>
                <div class="white-backdrop">
                    <!-- Static first-question layout stays editable with scripts disabled. -->
                    <ol class="quiz-progress" id="quiz-progress" aria-label="Question progress">
                        <li class="is-current">
                            <span class="quiz-step" role="img" aria-label="Question 1: Income loss, current" aria-current="step" title="Income loss"> <img class="quiz-step-image" src="assets/icons/income-loss-icon.svg" alt="" width="70" height="70"> <img class="quiz-step-tick" src="assets/icons/completed-tick.svg" alt="" width="17" height="16"> </span>
                        </li>
                        <li class="is-upcoming">
                            <span class="quiz-step" role="img" aria-label="Question 2: Extra income, upcoming" title="Extra income"> <img class="quiz-step-image" src="assets/icons/extra-income-icons.svg" alt="" width="70" height="70"> <img class="quiz-step-tick" src="assets/icons/completed-tick.svg" alt="" width="17" height="16"> </span>
                        </li>
                        <li class="is-upcoming">
                            <span class="quiz-step" role="img" aria-label="Question 3: Consistent saving, upcoming" title="Consistent saving"> <img class="quiz-step-image" src="assets/icons/consistent-saving-icon.svg" alt="" width="70" height="70"> <img class="quiz-step-tick" src="assets/icons/completed-tick.svg" alt="" width="17" height="16"> </span>
                        </li>
                        <li class="is-upcoming">
                            <span class="quiz-step" role="img" aria-label="Question 4: Unexpected expenses, upcoming" title="Unexpected expenses"> <img class="quiz-step-image" src="assets/icons/unexpected-expense-icon.svg" alt="" width="70" height="70"> <img class="quiz-step-tick" src="assets/icons/completed-tick.svg" alt="" width="17" height="16"> </span>
                        </li>
                        <li class="is-upcoming">
                            <span class="quiz-step" role="img" aria-label="Question 5: Retirement, upcoming" title="Retirement"> <img class="quiz-step-image" src="assets/icons/retirement-icon.svg" alt="" width="70" height="70"> <img class="quiz-step-tick" src="assets/icons/completed-tick.svg" alt="" width="17" height="16"> </span>
                        </li>
                        <li class="is-upcoming">
                            <span class="quiz-step" role="img" aria-label="Question 6: Managing debt, upcoming" title="Managing debt"> <img class="quiz-step-image" src="assets/icons/debt-management.svg" alt="" width="70" height="70"> <img class="quiz-step-tick" src="assets/icons/completed-tick.svg" alt="" width="17" height="16"> </span>
                        </li>
                        <li class="is-upcoming">
                            <span class="quiz-step" role="img" aria-label="Question 7: Online tools, upcoming" title="Online tools"> <img class="quiz-step-image" src="assets/icons/online-tools-icon.svg" alt="" width="70" height="70"> <img class="quiz-step-tick" src="assets/icons/completed-tick.svg" alt="" width="17" height="16"> </span>
                        </li>
                    </ol>
                    <div class="container content-area">
                        <form id="quiz-form">
                            <fieldset>
                                <legend class="quiz-question" id="quiz-question" tabindex="-1">If your income stopped tomorrow, how long could you comfortably cover your essential expenses?</legend>
                                <div class="quiz-answers" id="quiz-answers">
                                    <label class="quiz-answer">
                                        <input class="quiz-answer-input" type="radio" name="answer" value="0" required>
                                        <span class="quiz-answer-copy">Six months or more</span>
                                    </label>
                                    <label class="quiz-answer">
                                        <input class="quiz-answer-input" type="radio" name="answer" value="1" required>
                                        <span class="quiz-answer-copy">Three to under six months</span>
                                    </label>
                                    <label class="quiz-answer">
                                        <input class="quiz-answer-input" type="radio" name="answer" value="2" required>
                                        <span class="quiz-answer-copy">One to under three months</span>
                                    </label>
                                    <label class="quiz-answer">
                                        <input class="quiz-answer-input" type="radio" name="answer" value="3" required>
                                        <span class="quiz-answer-copy">Less than one month or I am not sure</span>
                                    </label>
                                </div>
                            </fieldset>
                            <div class="quiz-actions">
                                <button class="btn btn-primary quiz-next" id="quiz-next" type="submit" disabled>
                                    Next
                                    <img class="btn-arrow" src="assets/icons/arrow-white.svg" alt="" width="20" height="20">
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <aside class="page-info" id="question-guide">
                    <img src="assets/icons/info-icon.svg" alt="" width="20" height="20">
                    <p>Choose the answer that feels closest<br>to your real life.</p>
                </aside>
                <p class="page-message" id="journey-error" role="alert" hidden></p>
                <p class="visually-hidden" id="quiz-status" role="status" aria-live="polite">Question 1 of 7</p>
                <noscript>
                    <p class="page-message">Please enable JavaScript to complete your profile.</p>
                </noscript>
            </section>
        </main>
        <footer class="page-footer">
            <div class="container">
                <p><a href="">Privacy policy</a> | <a href="">Disclaimer</a> | <a href="">Company information</a></p>
            </div>
        </footer>

        <script src="assets/js/popper.min.js"></script>

        <script src="journey.js" defer></script>
        <script src="questions.js" defer></script>
        <script src="pgia/lib/pgia.js"></script>
    </body>
</html>
